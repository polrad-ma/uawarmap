<!DOCTYPE html>
<html>
<head>
  <title>Polrad Mapping Ukraine Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="utf-8">

  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.2/dist/leaflet.css"
        integrity="sha256-sA+zWATbFveLLNqWO2gtiw3HL/lh1giY/Inf1BJ0z14="
        crossorigin=""/>

  <script src="https://unpkg.com/leaflet@1.9.2/dist/leaflet.js"
          integrity="sha256-o9N1jGDZrf5tS+Ft4gbIK7mYMipq9lqpVJ91xHSyKhg="
          crossorigin=""></script>

  <style>
    body {
      margin: 0;
      padding: 0;
    }

    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      right: 0;
      left: 0;
    }

    #map-title {
      position: relative;
      margin-top: 10px;
      margin-left: 50px;
      float: left;
      background: white;
      border: 2px solid rgba(0,0,0,0.2);
      padding: 6px 8px;
      font-family: Helvetica;
      font-weight: bold;
      font-size: 24px;
      z-index: 800;
    }

    #layer-upload {
      position: absolute;
      top: 70px;
      left: 10px;
      z-index: 1000;
      background: white;
      padding: 10px;
      border-radius: 5px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.4);
      font-family: Arial;
    }

    #layer-upload button {
      cursor: pointer;
      padding: 6px 10px;
    }

    #file-input {
      display: none;
    }
  </style>
</head>

<body>

  <div id="map-title">Polrad Mapping Ukraine Map</div>
  <div id="map"></div>

  <div id="layer-upload">
    <button onclick="document.getElementById('file-input').click()">
      📁 Add GeoJSON Layer
    </button>

    <input
      type="file"
      id="file-input"
      accept=".geojson,.json"
    >
  </div>

  <script>

    // =========================
    // MAP
    // =========================

    var map = L.map('map', {
      center: [48.00, 37.75],
      zoom: 8,
      scrollWheelZoom: true
    });

    L.tileLayer(
      'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
      {
        attribution:
          '&copy; <a href="https://osm.org/copyright">OpenStreetMap</a> contributors, ' +
          '&copy; <a href="https://carto.com/attribution">CARTO</a>'
      }
    ).addTo(map);


    // =========================
    // EXISTING TEST MARKER
    // =========================

    L.marker([41.77, -72.69])
      .addTo(map)
      .bindPopup("Testing");


    // =========================
    // LAYER CONTROL
    // =========================

    var overlays = {};

    var layerControl = L.control.layers(
      null,
      overlays,
      {
        collapsed: false
      }
    ).addTo(map);


    // =========================
    // GEOJSON IMPORT
    // =========================

    document.getElementById('file-input')
      .addEventListener('change', function(event) {

        var file = event.target.files[0];

        if (!file) {
          return;
        }

        var reader = new FileReader();

        reader.onload = function(e) {

          try {

            var geojson = JSON.parse(e.target.result);

            var layer = L.geoJSON(geojson, {

              style: {
                color: "#ff0000",
                weight: 3,
                fillOpacity: 0.25
              },

              onEachFeature: function(feature, layer) {

                if (feature.properties) {

                  var popupContent = "";

                  for (var key in feature.properties) {

                    popupContent +=
                      "<b>" + key + ":</b> " +
                      feature.properties[key] +
                      "<br>";

                  }

                  if (popupContent !== "") {
                    layer.bindPopup(popupContent);
                  }

                }

              }

            }).addTo(map);


            // Use filename as layer name
            var layerName = file.name.replace(/\.[^/.]+$/, "");

            overlays[layerName] = layer;

            layerControl.addOverlay(layer, layerName);

            // Zoom to imported layer
            map.fitBounds(layer.getBounds());

            alert(
              'Layer "' +
              layerName +
              '" successfully added!'
            );

          } catch (error) {

            alert(
              "Could not read this file.\n\n" +
              "Make sure it is a valid GeoJSON file."
            );

            console.error(error);

          }

        };

        reader.readAsText(file);

        // Allow selecting the same file again
        event.target.value = "";

      });

  </script>

</body>
</html>
