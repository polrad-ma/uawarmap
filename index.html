```html
<!DOCTYPE html>
<html>
<head>
  <title>leaflet-map-simple</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="utf-8">

  <!-- Load Leaflet code library -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.2/dist/leaflet.css"
        integrity="sha256-sA+zWATbFveLLNqWO2gtiw3HL/lh1giY/Inf1BJ0z14="
        crossorigin="" />

  <script src="https://unpkg.com/leaflet@1.9.2/dist/leaflet.js"
          integrity="sha256-o9N1xGDZrf5tS+Ft4gbIK7mYMipq9lqpVJ91xHSyKhg="
          crossorigin=""></script>

  <!-- KML plugin -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-omnivore/0.3.4/leaflet-omnivore.min.js"></script>

  <!-- Position the map and title with CSS -->
  <style>
  body { margin:0; padding:0; }
  #map { position: absolute; top:0; bottom:0; right:0; left:0; }
  #map-title {
    position: relative;
    margin-top: 10px;
    margin-left: 50px;
    float: left;
    background: white;
    border: 2px solid rgba(0,0,0,0.2);
    padding: 6px 8px;
    font-family: Helvetica;
    font-weight: bold;
    font-size: 24px;
    z-index: 800;
  }
  </style>
</head>

<body>

  <!-- Display the map and title -->
  <div id="map-title">Polrad Mapping Ukraine Map</div>
  <div id="map"></div>

  <!-- Create the interactive map -->
  <script>

  /* Set up the initial map center and zoom level */
  var map = L.map('map', {
    center: [48.00, 37.75],
    zoom: 8,
    scrollWheelZoom: true
  });

  /* Display basemap tiles */
  L.tileLayer(
    'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://osm.org/copyright">\
        OpenStreetMap</a> contributors, &copy;\
        <a href="https://carto.com/attribution">CARTO</a>'
  }).addTo(map);

  /* Display a point marker with pop-up text */
  L.marker([41.77, -72.69]).addTo(map)
  .bindPopup("Testing");

  </script>
</body>
</html>
