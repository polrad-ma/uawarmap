<div class="sidebar-panel" id="panel-draw">
    <h4>Draw Tools</h4>

    <div class="tool-group-header">Solid Tools</div>
    <button class="tool-btn" id="btn-freehand" onclick="setActiveTool('freehand')">Freehand</button>
    <button class="tool-btn" id="btn-freehand-arrow" onclick="setActiveTool('freehand-arrow')">Freehand Arrow</button>
    <button class="tool-btn" id="btn-arrow" onclick="setActiveTool('arrow')">Arrow</button>

    <div class="tool-group-header">Dashed Tools</div>
    <button class="tool-btn" id="btn-dashed-freehand" onclick="setActiveTool('dashed-freehand')">Dashed Freehand</button>
    <button class="tool-btn" id="btn-dashed-freehand-arrow" onclick="setActiveTool('dashed-freehand-arrow')">Dashed Freehand Arrow</button>
    <button class="tool-btn" id="btn-dashed-line" onclick="setActiveTool('dashed-line')">Dashed Line</button>
    <button class="tool-btn" id="btn-dashed-arrow" onclick="setActiveTool('dashed-arrow')">Dashed Arrow</button>

    <div class="tool-group-header">Shapes & Utilities</div>
    <button class="tool-btn" id="btn-polygon" onclick="setActiveTool('polygon')">Polygon</button>
    <button class="tool-btn" id="btn-rectangle" onclick="setActiveTool('rectangle')">Rectangle</button>
    <button class="tool-btn" id="btn-eraser" onclick="setActiveTool('eraser')">Eraser</button>

    <div class="thickness-row" style="margin-top: 10px;">
      <label>Thickness: <span id="thickness-val">3px</span></label>
      <input type="range" id="thickness-slider" min="1" max="15" value="3" oninput="setThickness(this.value)">
    </div>

    <div id="color-row">
      <span class="color-btn selected" id="color-red" style="background:#ff0000; color:white;" onclick="setColor('#ff0000')">Red</span>
      <span class="color-btn" id="color-blue" style="background:#0000ff; color:white;" onclick="setColor('#0000ff')">Blue</span>
      <span class="color-btn" id="color-green" style="background:#2ecc71; color:white;" onclick="setColor('#2ecc71')">Green</span>
      <span class="color-btn" id="color-yellow" style="background:#f1c40f; color:black;" onclick="setColor('#f1c40f')">Yellow</span>
      <span class="color-btn" id="color-black" style="background:#171717; color:white;" onclick="setColor('#171717')">Black</span>
      <span class="color-btn" id="color-white" style="background:#ffffff; color:black;" onclick="setColor('#ffffff')">White</span>
    </div>

    <button class="tool-btn" onclick="finishShape()">Finish Shape</button>
    <button class="tool-btn" onclick="clearDrawings()">Clear My Drawings</button>
    <div class="panel-result" id="draw-result">Select a shape to draw.</div>
  </div>
