<!DOCTYPE html>
<html>
<head>
  <title>Polrad Mapping Ukraine Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="utf-8">
  <!-- Load Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Map styling -->
  <style>
    body {
      margin: 0;
      padding: 0;
    }
    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      right: 0;
      left: 0;
    }
    #map-title {
      position: relative;
      margin-top: 10px;
      margin-left: 50px;
      float: left;
      background: white;
      border: 2px solid rgba(0,0,0,0.2);
      padding: 6px 8px;
      font-family: Helvetica;
      font-weight: bold;
      font-size: 24px;
      z-index: 800;
    }
  </style>
</head>
<body>
  <!-- Map title -->
  <div id="map-title">Polrad Mapping Ukraine Map</div>
  <!-- Map -->
  <div id="map"></div>
  <script>
    // ============================
    // CREATE MAP
    // ============================
    var map = L.map('map', {
      center: [48.00, 37.75],
      zoom: 5,
      scrollWheelZoom: true
    });

    // ============================
    // BASEMAP
    // ============================
    L.tileLayer(
      'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
      {
        attribution:
          '&copy; <a href="https://osm.org/copyright">OpenStreetMap</a> contributors, ' +
          '&copy; <a href="https://carto.com/attribution">CARTO</a>'
      }
    ).addTo(map);

    // ============================
    // LAYER SWITCHER (created empty, filled in as layers load)
    // ============================
    var layerControl = L.control.layers(
      null,
      null,
      {
        collapsed: false
      }
    ).addTo(map);

    // ============================
    // GEOJSON LAYERS
    // Add one entry per file here. Each needs:
    //   file  -> exact filename in the repo (spaces need %20, parentheses %28 %29)
    //   name  -> label shown in the layer switcher
    //   color -> line/fill color for that layer
    // ============================
    var layerFiles = [
      {
        file: "neatogeo_Russian-controlled%20territory.geojson",
        name: "Russian-controlled territory",
        color: "#a51427"
      },
      {
        file: "neatogeo_Frontline%20towns%20%28from%20PWM%29.geojson",
        name: "Frontline towns (from PWM)",
        color: "#e67e22"
      },
      {
        file: "neatogeo_Cities%20captured%20this%20year.geojson",
        name: "Cities captured this year",
        color: "#8e44ad"
      },
      {
        file: "neatogeo_Ukrainian-controlled%20territory.geojson",
        name: "Ukrainian-controlled territory",
        color: "#1427a5"
      }
    ];

    layerFiles.forEach(function(layerInfo) {
      fetch(layerInfo.file)
        .then(function(response) {
          if (!response.ok) {
            throw new Error('HTTP error, status = ' + response.status + ' for ' + layerInfo.file);
          }
          return response.json();
        })
        .then(function(data) {
          var layer = L.geoJSON(data, {
            style: function(feature) {
              return {
                color: layerInfo.color,
                weight: 2,
                fillColor: layerInfo.color,
                fillOpacity: 0.4
              };
            }
          }).addTo(map);

          layerControl.addOverlay(layer, layerInfo.name);

          console.log(layerInfo.name + " loaded. Feature count:", data.features.length);
        })
        .catch(function(error) {
          console.error("Could not load layer '" + layerInfo.name + "':", error);
        });
    });

  </script>
</body>
</html>
