<!DOCTYPE html>
<html>
<head>
  <title>Polrad Mapping Ukraine Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="utf-8">

  <!-- Load Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- KML support -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-omnivore/0.3.4/leaflet-omnivore.min.js"></script>

  <!-- Map styling -->
  <style>
    body {
      margin: 0;
      padding: 0;
    }

    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      right: 0;
      left: 0;
    }

    #map-title {
      position: relative;
      margin-top: 10px;
      margin-left: 50px;
      float: left;
      background: white;
      border: 2px solid rgba(0,0,0,0.2);
      padding: 6px 8px;
      font-family: Helvetica;
      font-weight: bold;
      font-size: 24px;
      z-index: 800;
    }
  </style>
</head>

<body>

  <!-- Map title -->
  <div id="map-title">Polrad Mapping Ukraine Map</div>

  <!-- Map -->
  <div id="map"></div>


  <script>

    // ============================
    // CREATE MAP
    // ============================

    var map = L.map('map', {
      center: [48.00, 37.75],
      zoom: 8,
      scrollWheelZoom: true
    });


    // ============================
    // BASEMAP
    // ============================

    L.tileLayer(
      'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
      {
        attribution:
          '&copy; <a href="https://osm.org/copyright">OpenStreetMap</a> contributors, ' +
          '&copy; <a href="https://carto.com/attribution">CARTO</a>'
      }
    ).addTo(map);


    // ============================
    // KML LAYER (loaded from your GitHub repo)
    // ============================

  var frontline = omnivore.kml('Russian-controlled%20territory.kml')
  .on('ready', function() {
    console.log("KML ready. Layer count:", frontline.getLayers().length);
    console.log("Bounds:", frontline.getBounds());
    map.fitBounds(frontline.getBounds());
  })
  .on('error', function(error) {
    console.error("Could not load KML:", error);
  });

      });


    // ============================
    // LAYER SWITCHER
    // ============================

    var overlays = {
      "Frontline": frontline
    };

    L.control.layers(
      null,
      overlays,
      {
        collapsed: false
      }
    ).addTo(map);


  </script>

</body>
</html>
