<!DOCTYPE html>
<html>
<head>
  <title>Polrad Mapping Ukraine Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="utf-8">

  <!-- Load Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Map styling -->
  <style>
    body {
      margin: 0;
      padding: 0;
    }

    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      right: 0;
      left: 0;
    }

    #map-title {
      position: relative;
      margin-top: 10px;
      margin-left: 50px;
      float: left;
      background: white;
      border: 2px solid rgba(0,0,0,0.2);
      padding: 6px 8px;
      font-family: Helvetica;
      font-weight: bold;
      font-size: 24px;
      z-index: 800;
    }
  </style>
</head>

<body>

  <!-- Map title -->
  <div id="map-title">Polrad Mapping Ukraine Map</div>

  <!-- Map -->
  <div id="map"></div>


  <script>

    // ============================
    // CREATE MAP
    // ============================

    var map = L.map('map', {
      center: [48.00, 37.75],
      zoom: 8,
      scrollWheelZoom: true
    });


    // ============================
    // BASEMAP
    // ============================

    L.tileLayer(
      'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
      {
        attribution:
          '&copy; <a href="https://osm.org/copyright">OpenStreetMap</a> contributors, ' +
          '&copy; <a href="https://carto.com/attribution">CARTO</a>'
      }
    ).addTo(map);


    // ============================
    // GEOJSON LAYER (loaded from your GitHub repo)
    // ============================

    var frontline; // declared here so it's accessible in the layer switcher below

   fetch('russian-controlled%20territory.geojson')
      .then(function(response) {
        if (!response.ok) {
          throw new Error('HTTP error, status = ' + response.status);
        }
        return response.json();
      })
      .then(function(data) {

        frontline = L.geoJSON(data, {
          style: function(feature) {
            return {
              color: "#a51427",     // border color
              weight: 2,             // border thickness
              fillColor: "#a51427",  // fill color
              fillOpacity: 0.4        // fill transparency (0-1)
            };
          }
        }).addTo(map);

        map.fitBounds(frontline.getBounds());

        // Add to layer switcher now that it's loaded
        layerControl.addOverlay(frontline, "Frontline");

        console.log("GeoJSON loaded. Feature count:", data.features.length);
      })
      .catch(function(error) {
        console.error("Could not load GeoJSON:", error);
      });


    // ============================
    // LAYER SWITCHER
    // ============================

    var layerControl = L.control.layers(
      null,
      null,
      {
        collapsed: false
      }
    ).addTo(map);


  </script>

</body>
</html>
