<!DOCTYPE html>
<html>
<head>
  <title>Russo-Ukrainian War Map (Polrad Mapping)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="utf-8">
  <!-- Load Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Map styling -->
  <style>
    body { margin: 0; padding: 0; }
    #map { position: absolute; top: 0; bottom: 0; right: 0; left: 0; }
    #map-title {
      position: relative;
      margin-top: 10px;
      margin-left: 50px;
      float: left;
      background: white;
      border: 2px solid rgba(0,0,0,0.2);
      padding: 6px 8px;
      font-family: Helvetica;
      font-weight: bold;
      font-size: 24px;
      z-index: 800;
    }
    #toolbar {
      position: absolute;
      bottom: 20px;
      left: 10px;
      z-index: 900;
      background: white;
      border: 2px solid rgba(0,0,0,0.2);
      border-radius: 4px;
      padding: 8px;
      font-family: Helvetica;
      width: 220px;
    }
    #toolbar h4 {
      margin: 0 0 6px 0;
      font-size: 14px;
    }
    .tool-btn {
      display: block;
      width: 100%;
      margin-bottom: 4px;
      padding: 6px 8px;
      font-size: 13px;
      font-family: Helvetica;
      border: 1px solid #999;
      border-radius: 3px;
      background: #f5f5f5;
      cursor: pointer;
      text-align: left;
    }
    .tool-btn:hover {
      background: #e8e8e8;
    }
    .tool-btn.active {
      background: #333;
      color: white;
      border-color: #333;
    }
    #draw-submenu, #color-row {
      display: none;
      margin-bottom: 4px;
      padding-left: 10px;
      border-left: 2px solid #ddd;
    }
    #draw-submenu.show, #color-row.show {
      display: block;
    }
    .color-btn {
      display: inline-block;
      width: 47%;
      padding: 6px 4px;
      font-size: 12px;
      font-family: Helvetica;
      border: 2px solid #999;
      border-radius: 3px;
      cursor: pointer;
      text-align: center;
      color: white;
    }
    .color-btn.selected {
      border-color: #000;
    }
    #tool-result {
      margin-top: 6px;
      font-size: 12px;
      color: #333;
      min-height: 32px;
    }

    /* UPDATES ICON + PANEL */
    #updates-icon {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 900;
      background: white;
      border: 2px solid rgba(0,0,0,0.2);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      cursor: pointer;
    }
    #updates-icon:hover {
      background: #f0f0f0;
    }
    #updates-panel {
      display: none;
      position: absolute;
      top: 62px;
      right: 10px;
      z-index: 900;
      background: white;
      border: 2px solid rgba(0,0,0,0.2);
      border-radius: 4px;
      padding: 12px;
      font-family: Helvetica;
      width: 280px;
      max-height: 60vh;
      overflow-y: auto;
    }
    #updates-panel.show {
      display: block;
    }
    #updates-panel h4 {
      margin: 0 0 8px 0;
      font-size: 15px;
    }
    .update-item {
      border-bottom: 1px solid #eee;
      padding: 6px 0;
      font-size: 13px;
    }
    .update-item:last-child {
      border-bottom: none;
    }
    .update-date {
      font-weight: bold;
      font-size: 12px;
      color: #555;
      display: block;
      margin-bottom: 2px;
    }
  </style>
</head>
<body>
  <div id="map-title">Russo-Ukrainian War Map (Polrad Mapping)</div>
  <div id="map"></div>

  <!-- UPDATES ICON + PANEL -->
  <div id="updates-icon" onclick="toggleUpdatesPanel()" title="Map Updates">📰</div>
  <div id="updates-panel">
    <h4>Map Updates</h4>
    <div id="updates-content">Loading...</div>
  </div>

  <!-- TOOLBAR -->
  <div id="toolbar">
    <h4>Map Tools</h4>

    <button class="tool-btn" id="btn-draw-toggle" onclick="toggleDrawSubmenu()">Draw ▾</button>

    <div id="draw-submenu">
      <button class="tool-btn" id="btn-polygon" onclick="setActiveTool('polygon')">Polygon</button>
      <button class="tool-btn" id="btn-freehand" onclick="setActiveTool('freehand')">Draw Freely</button>
      <button class="tool-btn" id="btn-arrow" onclick="setActiveTool('arrow')">Arrow</button>
      <button class="tool-btn" id="btn-rectangle" onclick="setActiveTool('rectangle')">Rectangle</button>
    </div>

    <div id="color-row">
      <span class="color-btn selected" id="color-red" style="background:#ff0000;" onclick="setColor('#ff0000')">Red</span>
      <span class="color-btn" id="color-blue" style="background:#0000ff;" onclick="setColor('#0000ff')">Blue</span>
    </div>

    <button class="tool-btn" id="btn-ruler" onclick="setActiveTool('ruler')">Ruler (Measure Distance)</button>
    <button class="tool-btn" id="btn-coords" onclick="setActiveTool('coords')">Show Coordinates</button>
    <button class="tool-btn" onclick="finishShape()">Finish Shape</button>
    <button class="tool-btn" onclick="clearDrawings()">Clear My Drawings</button>
    <div id="tool-result">Select a tool to get started.</div>
  </div>

  <script>
    // ============================
    // BASEMAPS
    // ============================
    var satellite = L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      {
        attribution:
          'Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community'
      }
    );

    var hybridBase = L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      { attribution: 'Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community' }
    );

    var hybridLabels = L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
      { attribution: 'Labels &copy; Esri' }
    );

    var hybrid = L.layerGroup([hybridBase, hybridLabels]);

    var streets = L.tileLayer(
      'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
      {
        attribution:
          '&copy; <a href="https://osm.org/copyright">OpenStreetMap</a> contributors, ' +
          '&copy; <a href="https://carto.com/attribution">CARTO</a>'
      }
    );

    var osmStandard = L.tileLayer(
      'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
      {
        attribution: '&copy; <a href="https://osm.org/copyright">OpenStreetMap</a> contributors'
      }
    );

    var topo = L.tileLayer(
      'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
      {
        attribution:
          '&copy; <a href="https://opentopomap.org">OpenTopoMap</a> (CC-BY-SA), ' +
          '&copy; <a href="https://osm.org/copyright">OpenStreetMap</a> contributors'
      }
    );

    // ============================
    // CREATE MAP (Hybrid as default basemap)
    // ============================
    var map = L.map('map', {
      center: [48.00, 37.75],
      zoom: 7,
      scrollWheelZoom: true,
      layers: [hybrid] // default basemap shown on load
    });

    // ============================
    // DEDICATED PANE FOR MARKERS
    // ============================
    map.createPane('markersPane');
    map.getPane('markersPane').style.zIndex = 650; // above overlayPane (400)

    // ============================
    // LAYER SWITCHER
    // ============================
    var baseLayers = {
      "Hybrid (Satellite + Labels)": hybrid,
      "Satellite (Esri)": satellite,
      "Streets (Light)": streets,
      "Streets (OSM Standard)": osmStandard,
      "Topographic": topo
    };

    var layerControl = L.control.layers(
      baseLayers,
      null,
      { collapsed: false }
    ).addTo(map);

    // ============================
    // GEOJSON LAYERS
    // ============================
    var layerFiles = [
      {
        file: "neatogeo_Russian-controlled%20territory.geojson",
        name: "Russian-controlled territory",
        color: "#F0001B",
        styleOverrides: {}
      },
      {
        file: "neatogeo_Frontline%20towns%20%28from%20PWM%29.geojson",
        name: "Frontline towns (from PWM)",
        color: "#ffffff",
        outlineColor: "#ffffff",
        fillOpacity: 0,
        styleOverrides: {}
      },
      {
        file: "neatogeo_Ukrainian-controlled%20territory.geojson",
        name: "Ukrainian-controlled territory",
        color: "#1427a5",
        styleOverrides: {}
      },
      {
        file: "neatogeo_Advances%20%28both%20sides%29.geojson",
        name: "Advances (both sides)",
        color: "#f1c40f",
        styleOverrides: {}
      },
      {
        file: "neatogeo_Territories%20regained%20in%20the%20last%20month.geojson",
        name: "Territories regained in the last month",
        color: "#2ecc71",
        styleOverrides: {}
      }
    ];

    layerFiles.forEach(function(layerInfo) {
      fetch(layerInfo.file)
        .then(function(response) {
          if (!response.ok) {
            throw new Error('HTTP error, status = ' + response.status + ' for ' + layerInfo.file);
          }
          return response.json();
        })
        .then(function(data) {
          var layer = L.geoJSON(data, {
            style: function(feature) {
              var featureName = feature.properties && feature.properties.name;
              var override = featureName && layerInfo.styleOverrides[featureName];

              var fillColor = (override && override.color) || layerInfo.color;
              var lineColor = (override && override.outlineColor) ||
                               layerInfo.outlineColor || fillColor;
              var fillOpacity = (layerInfo.fillOpacity !== undefined) ? layerInfo.fillOpacity : 0.4;

              return {
                color: lineColor,
                weight: 2,
                fillColor: fillColor,
                fillOpacity: fillOpacity
              };
            }
          }).addTo(map);

          layerControl.addOverlay(layer, layerInfo.name);

          console.log(layerInfo.name + " loaded. Feature count:", data.features.length);
        })
        .catch(function(error) {
          console.error("Could not load layer '" + layerInfo.name + "':", error);
        });
    });

    // ============================
    // CAPTURED CITIES (red markers, always clickable via dedicated pane)
    // ============================
    var capturedCities = [
      { name: "Chasiv Yar",       date: "July 28", lat: 48.58025, lng: 37.83719 },
      { name: "Kostiantynivka",   date: "July 28", lat: 48.52486, lng: 37.6986  },
      { name: "Bilytske",         date: "July 26", lat: 48.40581, lng: 37.18269 },
      { name: "Rodynske",         date: "July 13", lat: 48.35097, lng: 37.20877 }
    ];

    var cityMarkers = L.layerGroup();

    capturedCities.forEach(function(city) {
      L.circleMarker([city.lat, city.lng], {
        pane: 'markersPane',
        radius: 7,
        color: "#8b0000",
        weight: 2,
        fillColor: "#ff0000",
        fillOpacity: 1
      })
        .bindPopup("<b>" + city.name + "</b><br>Captured " + city.date)
        .addTo(cityMarkers);
    });

    cityMarkers.addTo(map);
    layerControl.addOverlay(cityMarkers, "Captured cities");

    // ============================
    // MAP UPDATES PANEL
    // Content comes from updates.json in the repo — only you can edit
    // that file via GitHub, so only you can change what visitors see here.
    // ============================
    function toggleUpdatesPanel() {
      document.getElementById('updates-panel').classList.toggle('show');
    }

    fetch('updates.json')
      .then(function(response) {
        if (!response.ok) {
          throw new Error('HTTP error, status = ' + response.status);
        }
        return response.json();
      })
      .then(function(updates) {
        var container = document.getElementById('updates-content');
        container.innerHTML = '';

        if (!updates.length) {
          container.innerHTML = '<em>No updates yet.</em>';
          return;
        }

        updates.forEach(function(item) {
          var div = document.createElement('div');
          div.className = 'update-item';
          div.innerHTML = '<span class="update-date">' + item.date + '</span>' + item.text;
          container.appendChild(div);
        });
      })
      .catch(function(error) {
        document.getElementById('updates-content').innerHTML = '<em>Could not load updates.</em>';
        console.error('Could not load updates.json:', error);
      });

    // ============================
    // VISITOR TOOLS: draw (polygon/freehand/arrow/rectangle), ruler, coordinates
    // Note: these drawings exist only in the visitor's own browser —
    // they are not saved, and other visitors won't see them.
    // ============================
    var activeTool = null;       // 'polygon' | 'freehand' | 'arrow' | 'rectangle' | 'ruler' | 'coords'
    var currentColor = '#ff0000';
    var drawingPoints = [];
    var previewLayer = null;
    var isMouseDown = false;
    var userDrawings = L.layerGroup().addTo(map);
    layerControl.addOverlay(userDrawings, "My Drawings & Measurements");

    var toolResult = document.getElementById('tool-result');
    var drawTools = ['polygon', 'freehand', 'arrow', 'rectangle'];

    function toggleDrawSubmenu() {
      document.getElementById('draw-submenu').classList.toggle('show');
    }

    function setColor(color) {
      currentColor = color;
      document.getElementById('color-red').classList.toggle('selected', color === '#ff0000');
      document.getElementById('color-blue').classList.toggle('selected', color === '#0000ff');
    }

    function setActiveTool(tool) {
      activeTool = (activeTool === tool) ? null : tool;
      resetDrawingState();
      updateToolButtons();
      updateInstructions();

      var showColor = drawTools.indexOf(activeTool) !== -1;
      document.getElementById('color-row').classList.toggle('show', showColor);

      if (drawTools.indexOf(tool) !== -1) {
        document.getElementById('draw-submenu').classList.add('show');
      }
    }

    function resetDrawingState() {
      drawingPoints = [];
      if (previewLayer) {
        map.removeLayer(previewLayer);
        previewLayer = null;
      }
      isMouseDown = false;
      map.dragging.enable();
    }

    function updateToolButtons() {
      document.querySelectorAll('.tool-btn').forEach(function(btn) {
        btn.classList.remove('active');
      });
      if (activeTool) {
        var btn = document.getElementById('btn-' + activeTool);
        if (btn) btn.classList.add('active');
      }
    }

    function updateInstructions() {
      var msgs = {
        polygon: "Click points to trace a shape, then click 'Finish Shape'.",
        freehand: "Click and drag on the map to draw freely.",
        arrow: "Click a start point, then click an end point to place an arrow.",
        rectangle: "Click one corner, then click the opposite corner.",
        ruler: "Click points to measure distance. Click 'Finish Shape' to stop.",
        coords: "Click anywhere on the map to see its coordinates."
      };
      toolResult.innerText = activeTool ? msgs[activeTool] : "Select a tool to get started.";
    }

    map.on('mousedown', function(e) {
      if (activeTool !== 'freehand') return;
      isMouseDown = true;
      map.dragging.disable();
      drawingPoints = [e.latlng];
      if (previewLayer) map.removeLayer(previewLayer);
      previewLayer = L.polyline(drawingPoints, { color: currentColor, weight: 3 }).addTo(map);
    });

    map.on('mousemove', function(e) {
      if (activeTool === 'freehand' && isMouseDown) {
        drawingPoints.push(e.latlng);
        previewLayer.setLatLngs(drawingPoints);
        return;
      }
      if (activeTool === 'rectangle' && drawingPoints.length === 1) {
        var bounds = L.latLngBounds(drawingPoints[0], e.latlng);
        if (previewLayer) map.removeLayer(previewLayer);
        previewLayer = L.rectangle(bounds, {
          color: currentColor, weight: 2, fillColor: currentColor, fillOpacity: 0.3
        }).addTo(map);
        return;
      }
      if (activeTool === 'arrow' && drawingPoints.length === 1) {
        if (previewLayer) map.removeLayer(previewLayer);
        previewLayer = L.polyline([drawingPoints[0], e.latlng], { color: currentColor, weight: 3 }).addTo(map);
      }
    });

    map.on('mouseup', function() {
      if (activeTool !== 'freehand' || !isMouseDown) return;
      isMouseDown = false;
      map.dragging.enable();
      if (drawingPoints.length >= 2) {
        userDrawings.addLayer(L.polyline(drawingPoints, { color: currentColor, weight: 3 }));
      }
      if (previewLayer) { map.removeLayer(previewLayer); previewLayer = null; }
      drawingPoints = [];
    });

    map.on('click', function(e) {
      if (!activeTool) return;

      if (activeTool === 'coords') {
        L.popup()
          .setLatLng(e.latlng)
          .setContent("Lat: " + e.latlng.lat.toFixed(5) + "<br>Lng: " + e.latlng.lng.toFixed(5))
          .openOn(map);
        toolResult.innerText = "Lat: " + e.latlng.lat.toFixed(5) + ", Lng: " + e.latlng.lng.toFixed(5);
        return;
      }

      if (activeTool === 'polygon' || activeTool === 'ruler') {
        drawingPoints.push(e.latlng);
        if (previewLayer) map.removeLayer(previewLayer);
        previewLayer = L.polyline(drawingPoints, {
          color: activeTool === 'ruler' ? '#000000' : currentColor,
          weight: 3,
          dashArray: activeTool === 'ruler' ? '6,6' : null
        }).addTo(map);

        if (activeTool === 'ruler' && drawingPoints.length > 1) {
          var total = 0;
          for (var i = 1; i < drawingPoints.length; i++) {
            total += map.distance(drawingPoints[i - 1], drawingPoints[i]);
          }
          toolResult.innerText = "Distance so far: " + (total / 1000).toFixed(2) + " km (" + Math.round(total) + " m)";
        }
        return;
      }

      if (activeTool === 'rectangle') {
        if (drawingPoints.length === 0) {
          drawingPoints.push(e.latlng);
        } else {
          var bounds = L.latLngBounds(drawingPoints[0], e.latlng);
          userDrawings.addLayer(L.rectangle(bounds, {
            color: currentColor, weight: 2, fillColor: currentColor, fillOpacity: 0.4
          }));
          if (previewLayer) { map.removeLayer(previewLayer); previewLayer = null; }
          drawingPoints = [];
        }
        return;
      }

      if (activeTool === 'arrow') {
        if (drawingPoints.length === 0) {
          drawingPoints.push(e.latlng);
        } else {
          addArrow(drawingPoints[0], e.latlng, currentColor);
          if (previewLayer) { map.removeLayer(previewLayer); previewLayer = null; }
          drawingPoints = [];
        }
      }
    });

    function addArrow(start, end, color) {
      userDrawings.addLayer(L.polyline([start, end], { color: color, weight: 3 }));

      var p1 = map.latLngToLayerPoint(start);
      var p2 = map.latLngToLayerPoint(end);
      var angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
      var headLength = 12;
      var headAngle = Math.PI / 7;

      var leftPt = L.point(
        p2.x - headLength * Math.cos(angle - headAngle),
        p2.y - headLength * Math.sin(angle - headAngle)
      );
      var rightPt = L.point(
        p2.x - headLength * Math.cos(angle + headAngle),
        p2.y - headLength * Math.sin(angle + headAngle)
      );

      var leftLatLng = map.layerPointToLatLng(leftPt);
      var rightLatLng = map.layerPointToLatLng(rightPt);

      userDrawings.addLayer(
        L.polygon([end, leftLatLng, rightLatLng], {
          color: color, fillColor: color, fillOpacity: 1, weight: 1
        })
      );
    }

    function finishShape() {
      if (activeTool === 'polygon' && drawingPoints.length >= 2) {
        if (drawingPoints.length >= 3) {
          userDrawings.addLayer(L.polygon(drawingPoints, {
            color: currentColor, weight: 2, fillColor: currentColor, fillOpacity: 0.4
          }));
        } else {
          userDrawings.addLayer(L.polyline(drawingPoints, { color: currentColor, weight: 3 }));
        }
      } else if (activeTool === 'ruler' && drawingPoints.length >= 2) {
        var total = 0;
        for (var i = 1; i < drawingPoints.length; i++) {
          total += map.distance(drawingPoints[i - 1], drawingPoints[i]);
        }
        var km = (total / 1000).toFixed(2);
        userDrawings.addLayer(
          L.polyline(drawingPoints, { color: '#000000', weight: 2, dashArray: '6,6' })
            .bindPopup("Distance: " + km + " km")
        );
      }
      setActiveTool(null);
    }

    function clearDrawings() {
      userDrawings.clearLayers();
      toolResult.innerText = "Cleared.";
    }

  </script>
</body>
</html>
